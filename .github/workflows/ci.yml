name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Fail if a secret leaked into the bundle
        run: |
          if grep -rl "gsk_\|re_[A-Za-z0-9]\{20,\}" dist/assets; then
            echo "::error::An API key appears in the client bundle"; exit 1
          fi
